# VERSA config for audio quality characterization of ASR datasets.
#
# Selected for:
#   - Reference-free / no-reference only (we don't have clean reference audio)
#   - Language-agnostic where possible (most ASR-based metrics in VERSA target
#     English/high-resource languages and won't be informative for endangered
#     languages — those are intentionally NOT included)
#   - Coverage of distinct quality axes: overall MOS, noise, reverberation,
#     coloration/distortion, intelligibility, voice activity
#
# All inputs are assumed to be 16 kHz, 16-bit mono WAV.
#
# A note on interpretation: the neural MOS predictors (UTMOS, DNSMOS, NISQA,
# DNSMOS-Pro, SQUIM) were trained on (mostly English) clean/degraded speech.
# Treat the absolute scores with caution for endangered languages. They are
# still useful as RELATIVE measures across your datasets, which is what you
# want for correlating audio quality with ASR architecture performance.

# ---------- Pseudo-MOS family (perceptual quality predictors) ----------
# - utmos: UTMOS overall MOS (most cited single MOS predictor)
# - dnsmos: DNSMOS P.835 — gives sig/bak/ovrl; "dnsmos_overall" is the headline
# - dnsmos_p808: DNSMOS P.808 overall MOS
# - plcmos: packet-loss-concealment MOS (sensitive to discontinuity / glitches)
# - dnsmos_pro_*: DNSMOS Pro variants trained on different MOS corpora
- name: pseudo_mos
  predictor_types: ["utmos", "dnsmos", "plcmos", "dnsmos_pro_bvcc", "dnsmos_pro_nisqa", "dnsmos_pro_vcc2018"]
  predictor_args:
    utmos:
      fs: 16000
    dnsmos:
      fs: 16000
    plcmos:
      fs: 16000

# ---------- TorchAudio-SQUIM (no-reference) ----------
# - torch_squim_pesq: estimated PESQ without reference
# - torch_squim_stoi: estimated STOI (intelligibility) without reference
# - torch_squim_si_sdr: estimated SI-SDR without reference
- name: squim_no_ref

# ---------- NISQA: multi-dimensional quality ----------
# Probably the single most useful metric for dataset characterization because
# it decomposes quality into noise, coloration, discontinuity, and loudness.
# Requires extra setup: run `tools/setup_nisqa.sh` from your versa checkout
# before using this config (see README). Comment out if not installed.
# - nisqa_mos_pred: overall MOS
# - nisqa_noi_pred: noisiness (lower = noisier)
# - nisqa_dis_pred: discontinuity
# - nisqa_col_pred: coloration
# - nisqa_loud_pred: loudness
- name: nisqa
  nisqa_model_path: ./tools/NISQA/weights/nisqa.tar

# ---------- SRMR: reverberation ----------
# Speech-to-Reverberation Modulation energy Ratio. Useful for fieldwork data
# recorded in untreated rooms.
- name: srmr
  n_cochlear_filters: 23
  low_freq: 125
  min_cf: 4
  max_cf: 128
  fast: True
  norm: False

# ---------- Sheet SSQA MOS ----------
# Another no-reference MOS predictor (different training data than UTMOS).
# Useful as an independent check against the pseudo_mos family.
- name: sheet_ssqa

# ---------- VQScore ----------
# Self-supervised quality score trained on clean speech only. Reasonably
# robust to language because it doesn't rely on phone/word-level supervision.
- name: vqscore

# ---------- VAD: voice activity ----------
# Returns per-utterance speech segment list. Useful for derived stats like
# speech-to-silence ratio per file (computed downstream).
- name: vad
  threshold: 0.5
  min_speech_duration_ms: 250
  max_speech_duration_s: 30
  min_silence_duration_ms: 200
  speech_pad_ms: 100

# ---------- (Optional, requires setup) Audiobox Aesthetics ----------
# Predicts content enjoyment, content usefulness, production complexity,
# production quality. Trained on Meta's Audiobox aesthetic data.
# Uncomment if installed.
# - name: audiobox_aesthetics

# ---------- (Optional, requires setup) ScoreQ no-reference ----------
# Contrastive-regression MOS, "natural" data domain is appropriate for
# real recordings. Uncomment if installed via tools/install_scoreq.sh.
# - name: scoreq_nr
#   data_domain: natural
#   model_cache: versa_cache/scoreq_pt-models
